<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Aamhi Kolhapuri</title>
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    <a href="index.html" class="back-button">Back to Home</a>
    <section class="contact">
        <div class="container">
            <h2>Contact Us</h2>
            <p>Have questions? Get in touch with us!</p>

            <div class="contact-wrapper">
                <!-- Contact Form -->
                <form id="contactForm">
                    <input type="text" id="name" placeholder="Your Name" required>
                    <input type="email" id="email" placeholder="Your Email" required>
                    <input type="text" id="subject" placeholder="Subject" required>
                    <textarea id="message" placeholder="Your Message" required></textarea>
                    <button type="submit">Send Message</button>
                </form>

                <!-- Contact Info -->
                <div class="contact-info">
                    <h3>Our Address</h3>
                    <p>Kolhapur, Maharashtra, India</p>

                    <h3>Call Us</h3>
                    <p>+91 84598 21282</p>

                    <h3>Email</h3>
                    <p>info@aamhiKolhapuri.com</p>

                    <h3>Follow Us</h3>
                    <div class="social-links">
                        <a href="facebook.html">Facebook</a>
                        <a href="instagram.html">Instagram</a>
                        <a href="twitter.html">Twitter</a>
                    </div>
                </div>
            </div>

            <!-- Google Map -->
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d62033.038435169805!2d74.1957323!3d16.7050344!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc12b226b4e19e9%3A0x1b4117b1df151a29!2sKolhapur%2C%20Maharashtra!5e0!3m2!1sen!2sin!4v1711209838453!5m2!1sen!2sin" 
                    width="100%" height="300" style="border:0;" allowfullscreen></iframe>
            </div>
        </div>
    </section>

    <script src="js/contact.js"></script>
</body>
</html>
