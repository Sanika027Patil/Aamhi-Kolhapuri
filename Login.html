<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aamhi Kolhapuri - Login & Register</title>
    <link rel="stylesheet" href="css/Login.css">
</head>
<body>

    <div class="container">
        <!-- Welcome Overlay (Moves Left) -->
        <div class="overlay" id="overlay">
            <div class="overlay-content">
                <h2 id="overlayText">Welcome to Aamhi Kolhapuri</h2>
                <p id="overlaySubText">Your home for authentic Kolhapuri chappals.</p>
                <button id="toggleButton" onclick="toggleForm()">Sign Up</button>
            </div>
        </div>

        <!-- Login & Register Forms -->
        <div class="form-box" id="formBox">
            <!-- Login Form -->
            <div class="form login-form">
                <h2>Login to Aamhi Kolhapuri</h2>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p>New here? <a href="#" onclick="toggleForm()">Register</a></p>
            </div>

            <!-- Register Form -->
            <div class="form register-form">
                <h2>Join Aamhi Kolhapuri</h2>
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email" required>
                <input type="text" placeholder="Phone Number" required>                
                <select required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirm Password" required>

                <label class="terms">
                    <input type="checkbox" required> I agree to the <a href="t&m.html">Terms & Conditions</a>
                </label>

                <button type="submit">Sign Up</button>
                <p>Already a member? <a href="#" onclick="toggleForm()">Login</a></p>
            </div>
        </div>
    </div>

    <script src="js/Login.js"></script>
</body>
</html>
