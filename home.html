<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aamhi Kolhapuri - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(45deg, #c5e5ff, #c01a5a, #000d47, #fc92bc);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: white;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .navbar {
            background: #d32f2f;
            padding: 15px;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        .hero {
            text-align: center;
            background: url('https://via.placeholder.com/1200x400') no-repeat center center/cover;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgb(255, 255, 255);
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(139, 156, 255, 0.7);
        }
        .content {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
            background: rgba(170, 169, 169, 0.877);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px;
            background: #750035;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #b71c1c;
        }
        .footer {
            text-align: center;
            padding: 10px;
            background: #222;
            color: rgb(255, 255, 255);
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .hero {
                font-size: 20px;
                height: 200px;
            }
            .content {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">Aamhi Kolhapuri</div>
    <a href="index.html" class="back-button">Back to Home</a>
    <div class="hero">Welcome to Kolhapur!</div>
    <div class="content">
        <h2><font face="Times New Roman" color="#000000"> Experience the Rich Heritage </font></h2>
        <h5><font face="Times New Roman" color="#000000">Discover the culture, traditions, and flavors of Kolhapur.</font></h5>
        <a href="explore.html" class="btn"><b>Explore</b></a>
        <a href="contact.html" class="btn"><b>Contact Us</b></a>
    </div>
    <div class="footer">&copy; 2025 Aamhi Kolhapuri | All Rights Reserved</div>
</body>
</html>
